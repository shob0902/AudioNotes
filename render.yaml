# Render Blueprint that provisions the backend web service, the static frontend and their shared env vars.
envVarGroups:
  - name: audio-notes-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "10080"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # The deployed frontend root, e.g. https://your-frontend.onrender.com (no trailing slash) — also add it in Google Cloud Console.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_API_URL
        value: https://api.vachana.ai/stt/v3
      - key: GNANI_LANGUAGE_CODE
        value: en-IN
      - key: GNANI_TRANSCRIPT_FORMAT
        value: transcribe
      - key: GNANI_CHUNK_SECONDS
        value: "30"
      - key: GNANI_TIMEOUT_SECONDS
        value: "45"
      - key: GNANI_MAX_RETRIES
        value: "3"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TIMEOUT_SECONDS
        value: "60"
      - key: GROQ_MAX_RETRIES
        value: "3"
      - key: GROQ_MAX_INPUT_CHARS
        value: "12000"
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_USE_PATH_STYLE
        value: "true"
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "200"
      - key: MIN_AUDIO_DURATION_SECONDS
        value: "120"
      - key: FRONTEND_URL
        sync: false
services:
  - type: web
    name: audio-notes-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVarGroups:
      - audio-notes-shared
    envVars:
      - key: BACKEND_URL
        sync: false
  - type: web
    name: audio-notes-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GITHUB_REPO_URL
        value: https://github.com/shob0902/AudioNotes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
